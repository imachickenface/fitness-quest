name: Keep the database awake

# Supabase pauses a free project after a week without use. Twice a week this asks the real project's
# database for one row as a signed-out visitor. The answer is "permission denied" (by design), but the
# request still reaches the database, which counts as use. Only the public publishable key is used.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the records table
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://cdwqgtguexebrnggasfr.supabase.co/rest/v1/records?select=id&limit=1' \
            -H 'apikey: sb_publishable_mNhr_n79UuEkxnFRKbu1Qw_AbKHYoh6')
          echo "HTTP $code"
          # 401 (permission denied) means the database answered; anything else is worth a look
          test "$code" = 401
